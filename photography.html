        images.forEach(imgObj => {
            // Käytetään imgObj.src ja imgObj.category
            const cleanName = imgObj.src.replace('.jpg', '').replace(/_/g, ' ');
            
            const item = `
                <div class="gallery-item group cursor-pointer" data-category="${imgObj.category}" onclick="openLightbox('portfolio-images/${imgObj.src}', '${cleanName}')">
                    <div class="frame-border aspect-[5/4] bg-subtle border border-gray-800 flex items-center justify-center p-8 transition-colors duration-500 group-hover:bg-[#151515] relative overflow-hidden">
                        <div class="img-container w-full h-full flex items-center justify-center">
                            <img src="portfolio-images/${imgObj.src}" alt="${cleanName}" loading="lazy" class="transition-transform duration-700 ease-out group-hover:scale-105">
                        </div>
                    </div>
                    <div class="mt-4 flex justify-between items-center opacity-60 group-hover:opacity-100 transition duration-500">
                        <p class="text-[10px] uppercase tracking-[0.2em] text-gray-400 group-hover:text-white transition">${cleanName}</p>
                        <span class="text-[10px] text-gray-600 group-hover:text-blue-400 transition transform translate-x-[-10px] opacity-0 group-hover:translate-x-0 group-hover:opacity-100">
                             VIEW &rarr;
                        </span>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', item);
        });

        // Suodatustoiminto (sama kuin ennen)
        function filterGallery(category) {
            const items = document.querySelectorAll('.gallery-item');
            const buttons = document.querySelectorAll('.filter-btn');

            buttons.forEach(btn => {
                btn.classList.remove('text-white', 'border-b', 'border-white', 'pb-1');
                btn.classList.add('text-gray-500');
                if(btn.innerText.toLowerCase() === category) {
                    btn.classList.remove('text-gray-500');
                    btn.classList.add('text-white', 'border-b', 'border-white', 'pb-1');
                }
            });

            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                    setTimeout(() => item.style.opacity = '1', 10);
                } else {
                    item.style.opacity = '0';
                    setTimeout(() => item.style.display = 'none', 500);
                }
            });
        }

        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const lbCap = document.getElementById('lightbox-caption');

        function openLightbox(src, caption) {
            lbImg.src = src;
            lbCap.innerText = caption;
            lb.style.display = 'flex';
            setTimeout(() => { lb.classList.remove('opacity-0'); }, 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lb.classList.add('opacity-0');
            setTimeout(() => {
                lb.style.display = 'none';
                lbImg.src = ''; 
            }, 300);
            document.body.style.overflow = 'auto';
        }
